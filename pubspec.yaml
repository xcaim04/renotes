name: renotes
description: "ReNotes - Notas de Investigación. Organiza proyectos, notas largas y etiquetas reutilizables en memoria."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# ReNotes no depende de ningún paquete de terceros: estado, navegación,
# persistencia y tipografía provienen del SDK de Flutter y de fuentes
# empaquetadas como assets.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500